<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디랩코딩 안산 블로그 이미지</title>
<style>
  :root { --or:#FF6A14; --ink:#17171C; --sub:#5E5E66; --bg:#FBF7F3; --line:#EFE6DC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-size:28px; margin:0 0 6px; }
  h2 { font-size:20px; margin:40px 0 12px; }
  p.lead { color:var(--sub); margin:0 0 24px; }
  .banner img { width:100%; border-radius:16px; display:block; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; }
  .card img { width:170px; height:170px; display:block; margin:0 auto 10px; }
  .card b { display:block; font-size:15px; margin-bottom:6px; }
  input { width:100%; font:12px ui-monospace,Menlo,monospace; padding:6px; border:1px solid var(--line); border-radius:8px; }
  button { margin-top:6px; width:100%; border:0; border-radius:8px; background:var(--or); color:#fff; font-weight:700; padding:8px; cursor:pointer; }
  code { background:#fff; border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>디랩코딩 안산캠퍼스 블로그 이미지</h1>
  <p class="lead">네이버 블로그 홈페이지형 꾸미기에 쓰는 배너와 위젯 이미지입니다. 아래 주소를 그대로 쓰면 됩니다.</p>

  <h2>배너</h2>
  <div class="banner"><img src="img/banner.png" alt="배너"></div>
  <p>이미지 주소: <code id="banner-url"></code></p>

  <h2>메뉴 위젯 (위젯직접등록용 코드)</h2>
  <p class="lead">각 코드의 <code>연결할주소</code> 부분을 카테고리·채널 주소로 바꿔서 네이버 위젯직접등록에 붙여 넣으세요.</p>
  <div class="grid" id="widgets"></div>
</main>
<script>
  const base = location.href.replace(/index\.html$/, '').replace(/[?#].*$/, '');
  document.getElementById('banner-url').textContent = base + 'img/banner.png';
  const W = [['1-academy', '학원 안내'], ['2-semester', '학기 안내'], ['3-news', '학원 소식'], ['4-instagram', '인스타그램'], ['5-kakao', '카카오톡']];
  document.getElementById('widgets').innerHTML = W.map(([k, name]) => {
    const code = `<a href="연결할주소" target="_blank"><img src="${base}img/widget-${k}-2x.png" width="170" height="170" border="0" alt="${name}"></a>`;
    return `<div class="card"><img src="img/widget-${k}-2x.png" alt="${name}"><b>${name}</b>
      <input readonly value='${code.replace(/'/g, '&#39;')}'><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='복사했어요'">코드 복사</button></div>`;
  }).join('');
</script>
</body>
</html>
